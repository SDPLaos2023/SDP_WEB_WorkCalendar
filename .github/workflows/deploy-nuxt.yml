name: Deploy Work_Calendar (Nuxt) with PM2

on:
  push:
    branches:
      - Deploy
      - Dev

jobs:
  call-deploy:
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    env:
      DEPLOY_DIR: ${{ github.ref_name == 'Deploy' && 'C:\inetpub\wwwroot\Work_Calendar\prd' || 'C:\inetpub\wwwroot\Work_Calendar_Dev\dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: Run tests
        run: bun run test
      - name: build Nuxt app
        run: bun run build
      - name: Copy build to IIS folder
        shell: cmd
        run: |
          if exist "${{ env.DEPLOY_DIR }}" rmdir /s /q "${{ env.DEPLOY_DIR }}"
          robocopy "%GITHUB_WORKSPACE%\.output" "${{ env.DEPLOY_DIR }}" /E /IS /IT /NFL /NDL /NJH /NJS
          if %errorlevel% leq 7 exit /b 0
          exit /b 1

  pm2_restart:
    needs: call-deploy
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    steps:
      - name: Restart PM2 (Production)
        if: github.ref_name == 'Deploy'
        shell: cmd
        run: |
          cd C:\inetpub\wwwroot\Work_Calendar
          pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save

      - name: Restart PM2 (Dev)
        if: github.ref_name == 'Dev'
        shell: cmd
        run: |
          cd C:\inetpub\wwwroot\Work_Calendar_Dev
          pm2 startOrRestart ecosystem.config.cjs --env development
          pm2 save
